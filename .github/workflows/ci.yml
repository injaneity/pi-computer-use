name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run checks
        run: npm test && npm run test:platform && npm run test:windows-scripts

      - name: Check commit messages
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:commits

  linux-native:
    name: Linux native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Linux platform checks
        run: npm run typecheck && npm run test:linux && npm run test:linux-scripts

      - name: Test and lint Linux helper
        if: matrix.arch == 'x64'
        working-directory: native/linux/bridge-rs
        run: |
          cargo test --locked -j1
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --all -- --check

      - name: Build Linux helper
        run: npm run build:linux -- --arch "${{ matrix.arch }}"

      - name: Validate Linux helper
        run: |
          set -euo pipefail
          binary="prebuilt/linux/${{ matrix.arch }}/linux-bridge"
          test -x "$binary"
          file "$binary" | grep -q 'ELF 64-bit'
